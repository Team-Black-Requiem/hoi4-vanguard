[package]
name = "arsenal"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vanguard"
crate-type = ["cdylib"]

[profile.release]
debug = true

[dependencies]
pyo3 = "0.20.0"

# Utilities
regex = "1.10.4"

# Logging
log = "0.4"
flexi_logger = "0.28.0" 

# OS specific 
winreg = "0.52.0" # Windows
native-dialog = "0.7.0" 

# Filesystem
jwalk = "0.8.1"

[dependencies.xxhash-rust]
version = "0.8.5"
features = ["xxh3", "const_xxh3"]