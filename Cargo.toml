[package]
name = "arsenal"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vanguard"
crate-type = ["cdylib"]

[profile.release]
debug = true

[dependencies]
pyo3 = "0.22.5"

# Utilities
regex = "1.11.1"
serde = { version = "1.0.214", features = ["derive"] }
hash32 = "0.3.1"
bincode = "1.3.3"
rayon = "1.10.0"

# Logging
log = "0.4.22"
flexi_logger = "0.29.5" 

# OS specific 
winreg = "0.52.0" # Windows
native-dialog = "0.7.0" 

# Filesystem
jwalk = "0.8.1"

[dependencies.xxhash-rust]
version = "0.8.12"
features = ["xxh3", "const_xxh3"]