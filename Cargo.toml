[package]
name = "arsenal"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vanguard"
crate-type = ["cdylib"]

[profile.release]
debug = true

[dependencies]
pyo3 = "0.24.2"

# Utilities
regex = "1.11.1"
serde = { version = "1.0.217", features = ["derive"] }
#vdf-serde = "0.3.0"
hash32 = "0.3.1"
bincode = "1.3.3"
#once_cell = "1.20.3"
dashmap = "6.1.0"
num_cpus = "1.16.0"
#rayon = "1.10.0"

# Parsing
nom = "7.1.3"
nom_locate = "5.0.0"

# Logging
log = "0.4.27"
flexi_logger = "0.30.1" 

# OS specific 
winreg = "0.55.0" # Windows
native-dialog = "0.7.0" 

# Filesystem
jwalk = "0.8.1"

[dependencies.xxhash-rust]
version = "0.8.15"
features = ["xxh3", "const_xxh3"]